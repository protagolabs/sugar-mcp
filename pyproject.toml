[project]
name = "sugar-mcp"
version = "0.3.23"
description = ""
authors = [
    {name = "yanrujing", email = "rujing.yan@protagonist-ai.com"}
]
repository = "https://github.com/protagolabs/sugar-mcp"
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = [
    "mcp (>=1.30.0,<2.0.0)",
    "netmind-sugar (==0.3.9)",
    "web3 (>=7.15.0,<8.0.0)",
    # Security floors for transitive deps (OSV scan 2026-10)
    "starlette (>=1.3.1)",
    "python-multipart (>=0.0.31)",
    "urllib3 (>=2.7.0)",
    "requests (>=2.33.0)",
    "click (>=8.3.3)",
    "idna (>=3.15)",
    "python-dotenv (>=1.2.2)"
]

packages = [{ include = "src/sugar_mcp" }]


[tool.poetry.scripts]
sugar-mcp = "sugar_mcp:main"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
